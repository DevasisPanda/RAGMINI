services:
  - type: web
    name: ragmini-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: poolside/laguna-s-2.1:free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PROVIDER_FAILOVER
        value: "true"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: pdf_documents
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_SECRET_KEY
        generateValue: true
